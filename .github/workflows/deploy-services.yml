name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [dev, uat, prod]

permissions:
  id-token: write
  contents: read

jobs:
  tracking-api:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish services/tracking-api/src/TrackNTrash.Tracking.Api -c Release -o publish/api
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-tracking-tracktrash-${{ inputs.environment }}
          package: publish/api

  tracking-functions:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish services/tracking-api/src/TrackNTrash.Tracking.Functions -c Release -o publish/func
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: func-tracking-tracktrash-${{ inputs.environment }}
          package: publish/func

  db-migrate:
    runs-on: ubuntu-latest
    needs: [tracking-api]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Apply schema + seed (idempotent)
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
          path: |
            database/schema/01_schema.sql
            database/schema/02_seed_reference.sql
            database/schema/03_views.sql
            analytics/asset-registry/sql/metrics.sql
            analytics/power-bi/sql/mart_schema.sql
            analytics/power-bi/sql/etl.sql
