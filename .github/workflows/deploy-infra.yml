name: Deploy Infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, uat, prod]

permissions:
  id-token: write   # OIDC federated login to Azure
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # gated approvals for uat/prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            -g rg-tracktrash-${{ inputs.environment }} \
            -f infra/bicep/main.bicep \
            -p @infra/bicep/params.${{ inputs.environment }}.json
      - name: Deploy
        run: |
          az deployment group create \
            -g rg-tracktrash-${{ inputs.environment }} \
            -f infra/bicep/main.bicep \
            -p @infra/bicep/params.${{ inputs.environment }}.json
